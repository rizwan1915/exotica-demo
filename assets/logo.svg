<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Deep dark maroon background gradient matching the site -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="50%" fy="45%">
      <stop offset="0%" stop-color="#34101e"/>
      <stop offset="50%" stop-color="#1f0913"/>
      <stop offset="100%" stop-color="#0d0307"/>
    </radialGradient>

    <!-- Gold gradient for ornamental elements -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#fae7b8"/>
      <stop offset="35%" stop-color="#deb567"/>
      <stop offset="70%" stop-color="#b88f3c"/>
      <stop offset="100%" stop-color="#e8ca7c"/>
    </linearGradient>

    <!-- Rich gold gradient for EXOTICA hero title -->
    <linearGradient id="exoticaGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#fff2c9"/>
      <stop offset="28%" stop-color="#ecd285"/>
      <stop offset="65%" stop-color="#cda14d"/>
      <stop offset="100%" stop-color="#e5c36d"/>
    </linearGradient>

    <!-- Crisp cream gradient for primary labels -->
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2e8d5"/>
    </linearGradient>

    <!-- Glow filter for Exotica -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blur"/>
      <feFlood flood-color="#d6b477" flood-opacity="0.35" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGrad)"/>

  <!-- ─── Thin outer frame lines ─── -->
  <rect x="28" y="28" width="544" height="544" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" opacity="0.65"/>
  <rect x="36" y="36" width="528" height="528" fill="none" stroke="url(#goldGrad)" stroke-width="0.3" opacity="0.35"/>

  <!-- Corner diamond accents -->
  <polygon points="28,28 33,28 28,33" fill="url(#goldGrad)" opacity="0.7"/>
  <polygon points="572,28 567,28 572,33" fill="url(#goldGrad)" opacity="0.7"/>
  <polygon points="28,572 33,572 28,567" fill="url(#goldGrad)" opacity="0.7"/>
  <polygon points="572,572 567,572 572,567" fill="url(#goldGrad)" opacity="0.7"/>

  <!-- ─── Top Brand Mark / Maison Motif ─── -->
  <g transform="translate(300, 140)" fill="none" stroke="url(#goldGrad)">
    <polygon points="0,-16 5,-11 0,-6 -5,-11" fill="url(#goldGrad)" stroke="none"/>
    <line x1="-70" y1="-11" x2="-16" y2="-11" stroke-width="0.6" opacity="0.6"/>
    <line x1="16" y1="-11" x2="70" y2="-11" stroke-width="0.6" opacity="0.6"/>
  </g>

  <!-- ─── "THE MAISON" super-label ─── -->
  <text
    x="300" y="186"
    font-family="'Playfair Display', 'Cormorant Garamond', 'EB Garamond', Georgia, serif"
    font-size="14"
    font-weight="400"
    letter-spacing="9"
    text-anchor="middle"
    fill="url(#goldGrad)"
    opacity="0.85"
  >THE MAISON</text>

  <!-- ─── "HOUSE OF VIVIAN" ─── -->
  <text
    x="300" y="244"
    font-family="'Playfair Display', 'Cormorant Garamond', 'EB Garamond', Georgia, serif"
    font-size="22"
    font-weight="500"
    letter-spacing="10"
    text-anchor="middle"
    fill="url(#creamGrad)"
    opacity="0.95"
  >HOUSE OF VIVIAN</text>

  <!-- ─── Separator rule set ─── -->
  <line x1="90" y1="274" x2="510" y2="274" stroke="url(#goldGrad)" stroke-width="0.6" opacity="0.55"/>
  <line x1="170" y1="278" x2="430" y2="278" stroke="url(#goldGrad)" stroke-width="1.3" opacity="0.85"/>
  <line x1="90" y1="282" x2="510" y2="282" stroke="url(#goldGrad)" stroke-width="0.6" opacity="0.55"/>

  <polygon points="175,278 178,274 181,278 178,282" fill="url(#goldGrad)" opacity="0.9"/>
  <polygon points="419,278 422,274 425,278 422,282" fill="url(#goldGrad)" opacity="0.9"/>

  <!-- ─── "Exotica" — Hero Display Name ─── -->
  <text
    x="300" y="386"
    font-family="'Playfair Display', 'Cormorant Garamond', 'EB Garamond', Georgia, serif"
    font-size="110"
    font-style="italic"
    font-weight="400"
    letter-spacing="3"
    text-anchor="middle"
    fill="url(#exoticaGold)"
    filter="url(#subtleGlow)"
  >Exotica</text>

  <!-- ─── Tagline rule set ─── -->
  <line x1="90" y1="422" x2="510" y2="422" stroke="url(#goldGrad)" stroke-width="0.6" opacity="0.55"/>
  <line x1="170" y1="426" x2="430" y2="426" stroke="url(#goldGrad)" stroke-width="1.3" opacity="0.85"/>
  <line x1="90" y1="430" x2="510" y2="430" stroke="url(#goldGrad)" stroke-width="0.6" opacity="0.55"/>

  <polygon points="175,426 178,422 181,426 178,430" fill="url(#goldGrad)" opacity="0.9"/>
  <polygon points="419,426 422,422 425,426 422,430" fill="url(#goldGrad)" opacity="0.9"/>

  <!-- ─── Tagline ─── -->
  <text
    x="300" y="468"
    font-family="'Playfair Display', 'Cormorant Garamond', 'EB Garamond', Georgia, serif"
    font-size="13.5"
    font-weight="400"
    letter-spacing="7"
    text-anchor="middle"
    fill="url(#creamGrad)"
    opacity="0.8"
  >THE ART OF LEAVING AN IMPRESSION</text>

</svg>
